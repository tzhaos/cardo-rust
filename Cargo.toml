[workspace]
members = ["crates/cardo-runtime", "crates/cardo-ui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
dirs = "6"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
gpui-kit = "=0.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
unic-langid = "0.9"
winreg = "0.55"
