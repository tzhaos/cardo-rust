[workspace]
members = ["crates/cardo-runtime", "crates/cardo-ui"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
cardo-runtime = { path = "crates/cardo-runtime" }
anyhow = "1.0"
dirs = "6"
localization-bundle = { package = "fluent-bundle", version = "0.16" }
localization-syntax = { package = "fluent-syntax", version = "0.12" }
gpui-kit = "=0.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
toml = "=1.1.6"
toml_edit = "=0.25.15"
tempfile = "3"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
unic-langid = "0.9"
winreg = "0.55"
