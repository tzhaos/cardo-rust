[package]
name = "cardo-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Composable Windows application startup and service lifetime"

[features]
default = []
config = ["cardo-runtime/config"]
database = ["cardo-runtime/database"]
localization = ["cardo-runtime/localization", "cardo-ui/localization"]
diagnostics = ["cardo-runtime/diagnostics"]
update = ["dep:cardo-update"]

[dependencies]
anyhow.workspace = true
gpui-kit.workspace = true
cardo-runtime.workspace = true
cardo-ui = { path = "../cardo-ui" }
cardo-platform.workspace = true
cardo-update = { workspace = true, optional = true }
