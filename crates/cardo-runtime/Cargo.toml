[package]
name = "cardo-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Desktop application storage, localization and diagnostics"

[features]
default = []
config = ["dep:toml", "dep:toml_edit"]
database = ["dep:rusqlite"]
localization = ["dep:localization-bundle", "dep:localization-syntax", "dep:unic-langid"]
diagnostics = ["dep:tracing-subscriber", "dep:tracing-appender"]

[dependencies]
anyhow.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
toml_edit = { workspace = true, optional = true }
tempfile.workspace = true
localization-bundle = { workspace = true, optional = true }
localization-syntax = { workspace = true, optional = true }
unic-langid = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
tracing-appender = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
winreg.workspace = true
